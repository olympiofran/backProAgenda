name: proagenda

services:
  mysql:
    image: mysql:8.4
    container_name: proagenda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proagenda
      MYSQL_USER: proagenda
      MYSQL_PASSWORD: proagenda
    ports:
      - "3306:3306"
    volumes:
      - proagenda_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  proagenda_mysql:
