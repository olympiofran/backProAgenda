name: proagenda

services:
  postgres:
    image: postgres:16
    container_name: proagenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proagenda
      POSTGRES_USER: proagenda
      POSTGRES_PASSWORD: proagenda
    ports:
      - "5432:5432"
    volumes:
      - proagenda_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proagenda -d proagenda"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  proagenda_postgres:
